<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="100%" stop-color="#0ea5e9" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <!-- Dark Navy HUD background circle -->
  <circle cx="50" cy="50" r="45" fill="#030712" stroke="#00f0ff" stroke-width="2" stroke-opacity="0.3" />
  <circle cx="50" cy="50" r="40" fill="none" stroke="#00f0ff" stroke-width="1" stroke-dasharray="8 4" stroke-opacity="0.5" />
  
  <!-- "PK" Monogram -->
  <text x="50" y="62" font-family="'Orbitron', sans-serif" font-weight="900" font-size="34" fill="url(#cyanGrad)" text-anchor="middle" filter="url(#glow)" letter-spacing="1">PK</text>
  
  <!-- Orbiting coordinate dot -->
  <circle cx="50" cy="8" r="3" fill="#00f0ff" filter="url(#glow)" />
</svg>